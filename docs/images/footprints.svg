<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="TETRA 6개 모델의 바닥 외곽을 위에서 같은 축척으로 비교한 그림. 길이와 폭(mm), 바퀴 간격, 라이다 위치를 표시한다">
  <style>
    text { font-family: -apple-system, 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }

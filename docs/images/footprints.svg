    .ub { fill: none; stroke: #90A4AE; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .axle { stroke: #263238; stroke-width: 2; }
    .wheel { fill: #263238; }
    .origin { fill: #FBC02D; stroke: #263238; stroke-width: 1; }
    .lidar { fill: #00897B; }
    .scan { fill: #00897B; fill-opacity: .18; }
    .ring { fill: none; stroke: #00897B; stroke-width: 1.5; }
    .fwd { fill: #90A4AE; }
    .bar { stroke: #263238; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161B22; }
      .card { fill: #0D1117; stroke: #30363D; }
      .title, .head { fill: #E6EDF3; }
      .sub { fill: #9DA7B1; }
      .dim { fill: #EF5350; }
      .fp { fill: #EF5350; stroke: #EF5350; }
      .ub { stroke: #6E7B85; }
      .axle { stroke: #C9D1D9; }
      .wheel { fill: #C9D1D9; }
      .lidar { fill: #4DB6AC; }
      .scan { fill: #4DB6AC; }
      .ring { stroke: #4DB6AC; }
      .fwd { fill: #6E7B85; }
      .bar { stroke: #C9D1D9; }
    }
    @media (prefers-reduced-motion: reduce) { .scan, .ring { display: none; } }
